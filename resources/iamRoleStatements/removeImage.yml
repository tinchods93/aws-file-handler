- Effect: Allow
  Action:
    - dynamodb:Query
    - dynamodb:DeleteItem
  Resource:
    - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${file(resources/index.json):tables.metadata}
    - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${file(resources/index.json):tables.metadata}/index/*