uploadFile:
  handler: src/infrastructure/primary/handlers/files/upload/index.handler
  description: 'Receives a file and uploads it to S3. The file is then stored in the database and a response is returned with the file URL and the file ID'
  name: ${file(resources/index.json):functions.uploadFile}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.uploadFile}
  iamRoleStatements: ${file(resources/iamRoleStatements/uploadFile.yml)}
  events:
    - http:
        path: files/upload
        method: post
        cors: true
        request:
          contentHandling: CONVERT_TO_BINARY
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }

getFile:
  handler: src/infrastructure/primary/handlers/files/get/index.handler
  description: 'Obtains a file from the S3 bucket and returns it to the user.'
  name: ${file(resources/index.json):functions.getFile}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.getFile}
  iamRoleStatements: ${file(resources/iamRoleStatements/getFile.yml)}
  events:
    - http:
        path: files/{fileName}
        method: get
        cors: true
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }

removeFile:
  handler: src/infrastructure/primary/handlers/files/remove/index.handler
  description: 'Receives a file and uploads it to S3. The file is then stored in the database and a response is returned with the file URL and the file ID'
  name: ${file(resources/index.json):functions.removeFile}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.removeFile}
  iamRoleStatements: ${file(resources/iamRoleStatements/removeFile.yml)}
  events:
    - http:
        path: files/{fileName}
        method: delete
        cors: true
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }


uploadImage:
  handler: src/infrastructure/primary/handlers/images/upload/index.handler
  description: 'Receives an image and uploads it to Cloudinary. The metadata is then stored in the database and a response is returned with the image URL and the image ID'
  name: ${file(resources/index.json):functions.uploadImage}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.uploadImage}
  iamRoleStatements: ${file(resources/iamRoleStatements/uploadImage.yml)}
  events:
    - http:
        path: images/upload
        method: post
        cors: true
        request:
          contentHandling: CONVERT_TO_BINARY
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }

removeImage:
  handler: src/infrastructure/primary/handlers/images/remove/index.handler
  description: 'Deletes an image from the Cloudinary and removes its metadata from the table.'
  name: ${file(resources/index.json):functions.removeImage}
  timeout: 25
  logRetentionInDays: 14
  iamRoleStatementsInherit: true
  iamRoleStatementsName: ${file(resources/index.json):functions.removeImage}
  iamRoleStatements: ${file(resources/iamRoleStatements/removeImage.yml)}
  events:
    - http:
        path: images/{publicId}
        method: delete
        cors: true
        authorizer:
          type: CUSTOM
          authorizerId: { Ref: Authorizer }
