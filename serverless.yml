# MARTIN_LOG DESCOMENTAR - service: ${self:custom.projectName}-file-handler${env:developerStack, ''}
service: ${self:custom.projectName}-file-handler${env:developerStack, ''}

configValidationMode: off
frameworkVersion: '>=3'

custom:
  useDotenv: true
  config: ${file(config/index.js)}
  projectName: aws
  stackPrefix: ${self:service}-${self:provider.stage}

  # Prune
  prune:
    automatic: true
    prod: 3
    staging: 2
    develop: 1
    number: 1

  developDomain: e1-api-protoprime.click
  prodDomain: prod-api-protoprime.click

  customDomain:
    domainName: ${self:custom.${self:provider.stage, 'develop'}Domain}
    basePath: files-ms${env:developerStack, ''}
    endpointType: 'regional'

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: ${opt:region, 'us-east-1'}
  accountId: !Ref AWS::AccountId
  stage: ${opt:stage, 'develop'}
  tracing:
    lambda: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 'xray:PutTraceSegments'
            - 'xray:PutTelemetryRecords'
          Resource: '*'
  environment:
    SERVICE: ${self:service}
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    ACCOUNT_ID: ${self:provider.accountId}
    LOG_LEVEL: DEBUG
    JWT_SECRET: 'test-secret'
    OWNER_PROJECT_NAME: 'Protoprime'
    FILES_METADATA_TABLE_NAME: ${file(resources/index.json):tables.metadata}
    FILE_BUCKET_NAME: ${file(resources/index.json):s3.fileStorage}
    CLOUDINARY_CLOUD_NAME: ${self:custom.config.services.cloudinary.cloudName}
    CLOUDINARY_API_KEY: ${self:custom.config.services.cloudinary.apiKey}
    CLOUDINARY_API_SECRET: ${self:custom.config.services.cloudinary.apiSecret}

package:
  individually: false
  excludeDevDependencies: true
  patterns:
    - '!node_modules/**'
  exclude:
    - node_modules/**

plugins:
  - serverless-iam-roles-per-function
  - serverless-prune-plugin
  - serverless-webpack
  - serverless-dotenv-plugin
  - serverless-domain-manager

resources:
  - ${file(resources/tables/table.yml)}
  - ${file(resources/s3/s3.yml)}
  - ${file(resources/apiGateway/authorizer.yml)}

functions:
  - ${file(src/functions.yml)}
